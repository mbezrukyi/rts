[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "rts"
version = "0.1.0"
description = "Spark pipelines for Databricks, described in TOML"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Mykola Bezrukyi" } ]
requires-python = ">=3.12"
scripts.rts = "rts.__main__:main"

[dependency-groups]
test = [ "pyspark>=4", "pytest" ]
